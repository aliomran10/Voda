<div class="date-picker-container">
  <label class="date-label">Filter by Date:</label>
  <div class="date-wrapper">
    <select class="date-select" [(ngModel)]="selectedDate" (change)="onDateChange()">
      <option value="">All Dates</option>
      @for (date of availableDates; track date) {
      <option [value]="date">
        {{ date }}
      </option>
      }
    </select>
  </div>
</div>
