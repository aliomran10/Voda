<div class="toggle-container">
  <span class="toggle-label">Temperature Unit:</span>
  <button class="toggle-button" (click)="toggleUnit()">
    <span class="current-unit">{{ displayText }}</span>
    <span class="toggle-icon">⇄</span>
    <span class="alternate-unit">{{ alternateText }}</span>
  </button>
</div>
