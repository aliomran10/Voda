<div class="city-history-container">
  @if (isLoading) {
  <div class="loading">
    <div class="spinner"></div>
    <p>Loading city weather history...</p>
  </div>
  } @if (error) {
  <div class="error">
    <p>{{ error }}</p>
    <a routerLink="/" class="back-button">Back to Weather List</a>
  </div>
  } @if (!isLoading && !error && city) {
  <div class="content">
    <app-header
      [city]="city"
      [temperatureUnit]="temperatureUnit"
      (unitChange)="onUnitChange($event)"
    >
    </app-header>

    <!-- Statistics Cards -->
    @if (stats) {
    <div class="stats-grid">
      <app-temperature-stat [stats]="stats" [temperatureSymbol]="temperatureSymbol">
      </app-temperature-stat>

      <app-humidity-stat [stats]="stats"></app-humidity-stat>

      <app-forecast-stat [city]="city"></app-forecast-stat>
    </div>
    }

    <!-- Chart -->
    <app-chart [city]="city" [temperatureUnit]="temperatureUnit"> </app-chart>

    <!-- Forecast Table -->
    <app-forecast-table [city]="city" [temperatureUnit]="temperatureUnit"> </app-forecast-table>
  </div>
  }
</div>
