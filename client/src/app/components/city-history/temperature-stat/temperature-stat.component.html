<div class="stat-card temperature">
  <div class="stat-icon">🌡️</div>
  <div class="stat-content">
    <h3>Temperature Range</h3>
    <div class="stat-values">
      <div class="stat-item">
        <span class="label">Min:</span>
        <span class="value"> {{ stats.minTemp | number : '1.0-1' }}{{ temperatureSymbol }} </span>
      </div>
      <div class="stat-item">
        <span class="label">Max:</span>
        <span class="value"> {{ stats.maxTemp | number : '1.0-1' }}{{ temperatureSymbol }} </span>
      </div>
      <div class="stat-item">
        <span class="label">Avg:</span>
        <span class="value highlight">
          {{ stats.avgTemp | number : '1.0-1' }}{{ temperatureSymbol }}
        </span>
      </div>
    </div>
  </div>
</div>
