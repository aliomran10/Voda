<div class="table-section">
  <h2 class="section-title">Complete Forecast Data</h2>

  <div class="table-wrapper">
    <table class="forecast-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Temperature</th>
          <th>Humidity</th>
          <th>Visual</th>
        </tr>
      </thead>

      <tbody>
        @for (forecast of city.forecast; track forecast.date) {
        <tr class="forecast-row">
          <td class="date-cell">
            <span class="date-text">{{ forecast.date }}</span>
          </td>

          <td class="temp-cell">
            <span class="temp-value">
              {{ getTemperature(forecast) | number : '1.0-1' }}{{ temperatureSymbol }}
            </span>
          </td>

          <td class="humidity-cell">
            <div class="humidity-container">
              <span class="humidity-value">{{ forecast.humidity }}%</span>
              <div class="humidity-bar">
                <div class="humidity-fill" [style.width.%]="forecast.humidity"></div>
              </div>
            </div>
          </td>

          <td class="visual-cell">
            <span class="weather-emoji">{{ getWeatherEmoji(forecast) }}</span>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
