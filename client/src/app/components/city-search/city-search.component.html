<div class="search-container">
  <div class="search-wrapper">
    <input
      type="text"
      class="search-input"
      [(ngModel)]="searchTerm"
      (input)="onSearchChange()"
      placeholder="Search for a city..."
    />
    <button
      *ngIf="searchTerm"
      class="clear-button"
      (click)="clearSearch()"
      aria-label="Clear search"
    >
      ×
    </button>
  </div>
</div>
